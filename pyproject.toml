[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# One distribution with both applications: Sondugrande, and the SoundGrain it
# was developed from (Olivier Belanger's, unchanged, as the soundgrain_resources
# package exactly as SoundGrain's own pyproject installs it).
[project]
name = "sondugrande"
dynamic = ["version"]
description = "SoundGrain in a room: draw where granular sound moves in space (Ambisonics, binaural, loudspeakers)"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Olivier Belanger (SoundGrain)"}, {name = "femifleming (Sondugrande)"}]
dependencies = ["pyo>=1.1.0", "wxPython", "markdown", "numpy"]

[project.scripts]
sondugrande = "Sondugrande:main"
soundgrain = "SoundGrain:main"
soundgrain-register-desktop = "soundgrain_resources.desktop:main"

[project.urls]
Homepage = "https://github.com/femifleming/sondugrande"
SoundGrain = "https://github.com/belangeo/soundgrain"

[tool.setuptools]
packages = ["soundgrain_resources", "sondugrande"]
package-dir = {soundgrain_resources = "Resources", sondugrande = "sondugrande"}
py-modules = ["SoundGrain", "Sondugrande"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "sondugrande.constants.SG_VERSION"}

[tool.setuptools.package-data]
soundgrain_resources = ["*.png", "*.ico", "*.icns", "*.sg", "images/*.png", "doc/*.md"]
sondugrande = ["*.png", "*.ico", "*.sgr", "images/*.png", "doc/*.md"]
